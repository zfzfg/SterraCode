# Optional app-only master key. Back up the external 32-byte file separately.
services:
  app:
    environment:
      STERRACODE_GIT_KEY_FILE: /run/codebase/git-key
    volumes:
      - type: bind
        source: ${STERRACODE_GIT_KEY_PATH:?Set a protected absolute Git master-key path}
        target: /run/codebase/git-key
        read_only: true
